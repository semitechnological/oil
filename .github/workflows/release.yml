name: CI / Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rebuild (e.g. 0.8.5). Skips version check, tag, release creation — only builds and attaches binaries.'
        required: true

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        run: cargo check

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true
  auto-tag:
    name: Auto-tag on version bump
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for version bump and push tag
        run: |
          CURRENT_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Current version: $CURRENT_VERSION"

          git show HEAD^:Cargo.toml > /tmp/old_cargo.toml 2>/dev/null || echo 'version = "0.0.0"' > /tmp/old_cargo.toml
          PREV_VERSION=$(grep '^version' /tmp/old_cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Previous version: $PREV_VERSION"

          TAG="v$CURRENT_VERSION"
          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
              echo "Tag $TAG already exists, skipping tag creation"
            else
              echo "Version changed from $PREV_VERSION to $CURRENT_VERSION. Tagging..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          else
            echo "Version unchanged."
          fi

  generate-notes:
    name: Generate release notes
    runs-on: ubuntu-latest
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    outputs:
      release_notes: ${{ steps.generate.outputs.notes }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes from git history
        id: generate
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
            PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${VERSION}$" | head -1 || echo "")
          else
            VERSION="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          echo "Current: $VERSION, Previous tag: $PREV_TAG"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            RANGE="${FIRST_COMMIT}..HEAD"
          fi

          NOTES=$(git log "$RANGE" --pretty=format:'- %s' --no-merges 2>/dev/null || true)

          if [ -z "$NOTES" ]; then
            if [ -n "$PREV_TAG" ]; then
              NOTES="## What's Changed
          See the [full changelog](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}) for details."
            else
              NOTES="## Release ${VERSION}
          Initial release."
            fi
          fi

          echo "$NOTES" > /tmp/release_notes.md

          echo "notes<<NOTES_EOF" >> $GITHUB_OUTPUT
          cat /tmp/release_notes.md >> $GITHUB_OUTPUT
          echo "NOTES_EOF" >> $GITHUB_OUTPUT



  build:
    name: Build ${{ matrix.distro }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            arch: x64
            target: x86_64-unknown-linux-gnu
            asset_name: oil-linux-x64
            container: ubuntu:24.04

          - distro: ubuntu
            arch: arm64
            target: aarch64-unknown-linux-gnu
            asset_name: oil-linux-arm64
            container: ubuntu:24.04

          - distro: fedora
            arch: x64
            target: x86_64-unknown-linux-gnu
            asset_name: oil-linux-x64-fedora
            container: ubuntu:24.04

          - distro: fedora
            arch: arm64
            target: aarch64-unknown-linux-gnu
            asset_name: oil-linux-arm64-fedora
            container: ubuntu:24.04

          - distro: arch
            arch: x64
            target: x86_64-unknown-linux-gnu
            asset_name: oil-linux-x64-arch
            container: ubuntu:24.04

          - distro: arch
            arch: arm64
            target: aarch64-unknown-linux-gnu
            asset_name: oil-linux-arm64-arch
            container: ubuntu:24.04

          - distro: alpine
            arch: x64
            target: x86_64-unknown-linux-musl
            asset_name: oil-linux-x64-musl
            container: alpine:latest

          - distro: alpine
            arch: arm64
            target: aarch64-unknown-linux-musl
            asset_name: oil-linux-arm64-musl
            container: ubuntu:24.04

          - distro: opensuse
            arch: x64
            target: x86_64-unknown-linux-gnu
            asset_name: oil-linux-x64-opensuse
            container: ubuntu:24.04

          - distro: opensuse
            arch: arm64
            target: aarch64-unknown-linux-gnu
            asset_name: oil-linux-arm64-opensuse
            container: ubuntu:24.04

          - distro: void
            arch: x64
            target: x86_64-unknown-linux-gnu
            asset_name: oil-linux-x64-void
            container: ubuntu:24.04

          - distro: void
            arch: arm64
            target: aarch64-unknown-linux-gnu
            asset_name: oil-linux-arm64-void
            container: ubuntu:24.04

          - distro: nixos
            arch: x64
            target: x86_64-unknown-linux-musl
            asset_name: oil-linux-x64-nix
            container: alpine:latest

          - distro: nixos
            arch: arm64
            target: aarch64-unknown-linux-musl
            asset_name: oil-linux-arm64-nix
            container: ubuntu:24.04

          - distro: freebsd
            arch: x64
            target: x86_64-unknown-freebsd
            asset_name: oil-freebsd-x64
            container: ''

          - distro: freebsd
            arch: arm64
            target: aarch64-unknown-freebsd
            asset_name: oil-freebsd-arm64
            container: ''

          - distro: gentoo
            arch: x64
            target: x86_64-unknown-linux-gnu
            asset_name: oil-linux-x64-gentoo
            container: ubuntu:24.04

          - distro: gentoo
            arch: arm64
            target: aarch64-unknown-linux-gnu
            asset_name: oil-linux-arm64-gentoo
            container: ubuntu:24.04

          - distro: solus
            arch: x64
            target: x86_64-unknown-linux-gnu
            asset_name: oil-linux-x64-solus
            container: ubuntu:24.04

          - distro: solus
            arch: arm64
            target: aarch64-unknown-linux-gnu
            asset_name: oil-linux-arm64-solus
            container: ubuntu:24.04

          - distro: openwrt
            arch: armv7
            target: armv7-unknown-linux-musleabihf
            asset_name: oil-linux-armv7-musl
            container: ubuntu:24.04

          - distro: openwrt
            arch: mips
            target: mips-unknown-linux-musl
            asset_name: oil-linux-mips-musl
            container: ubuntu:24.04

          - distro: openwrt
            arch: mipsel
            target: mipsel-unknown-linux-musl
            asset_name: oil-linux-mipsel-musl
            container: ubuntu:24.04

          - distro: swupd
            arch: x64
            target: x86_64-unknown-linux-gnu
            asset_name: oil-linux-x64-swupd
            container: ubuntu:24.04



    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Debian/Ubuntu)
        if: matrix.container != '' && contains(matrix.container, 'ubuntu')
        run: |
          apt-get update
          apt-get install -y curl gcc g++ pkg-config libssl-dev

      - name: Install system deps (Fedora)
        if: matrix.container != '' && contains(matrix.container, 'fedora')
        run: |
          dnf install -y curl gcc gcc-c++ pkg-config openssl-devel

      - name: Install system deps (Arch)
        if: matrix.container != '' && contains(matrix.container, 'arch')
        run: |
          pacman -Syu --noconfirm curl gcc pkg-config openssl

      - name: Install system deps (Alpine)
        if: matrix.container != '' && contains(matrix.container, 'alpine')
        run: |
          apk add bash curl gcc g++ pkgconfig openssl-dev musl-dev

      - name: Install system deps (openSUSE)
        if: matrix.container != '' && contains(matrix.container, 'opensuse')
        run: |
          zypper --non-interactive install curl gcc gcc-c++ pkg-config openssl-devel

      - name: Install system deps (Void)
        if: matrix.container != '' && contains(matrix.container, 'voidlinux')
        run: |
          xbps-install -Sy curl gcc pkg-config openssl-devel make

      - name: Install cross-compilation tools (openwrt / ARM64)
        if: (matrix.arch == 'arm64' || matrix.distro == 'openwrt') && matrix.distro != 'freebsd' && matrix.distro != 'openbsd'
        run: |
          if command -v apt-get &>/dev/null; then
            apt-get update
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              apt-get install -y gcc-aarch64-linux-gnu
            elif [ "${{ matrix.arch }}" = "armv7" ]; then
              apt-get install -y gcc-arm-linux-gnueabihf
            elif [ "${{ matrix.arch }}" = "mips" ]; then
              apt-get install -y gcc-mips-linux-gnu
            elif [ "${{ matrix.arch }}" = "mipsel" ]; then
              apt-get install -y gcc-mipsel-linux-gnu
            fi
          elif command -v dnf &>/dev/null; then
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              dnf install -y gcc-aarch64-linux-gnu
            fi
          elif command -v pacman &>/dev/null; then
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              pacman -S --noconfirm aarch64-linux-gnu-gcc
            fi
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        if: !(matrix.distro == 'openwrt' && (matrix.arch == 'mips' || matrix.arch == 'mipsel'))
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust (Nightly for Tier 3 OpenWrt targets)
        uses: dtolnay/rust-toolchain@stable
        if: matrix.distro == 'openwrt' && (matrix.arch == 'mips' || matrix.arch == 'mipsel')
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Create FreeBSD cargo config
        if: matrix.distro == 'freebsd'
        run: |
          mkdir -p ~/.cargo
          echo '[target.x86_64-unknown-freebsd]' >> ~/.cargo/config.toml
          echo 'linker = "rust-lld"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "linker-flavor=ld.lld"]' >> ~/.cargo/config.toml
          echo '[target.aarch64-unknown-freebsd]' >> ~/.cargo/config.toml
          echo 'linker = "rust-lld"' >> ~/.cargo/config.toml
          echo 'rustflags = ["-C", "linker-flavor=ld.lld"]' >> ~/.cargo/config.toml

      - name: Create OpenWrt cargo config
        if: matrix.distro == 'openwrt'
        run: |
          mkdir -p ~/.cargo
          if [ "${{ matrix.arch }}" = "armv7" ]; then
            echo '[target.armv7-unknown-linux-musleabihf]' >> ~/.cargo/config.toml
            echo 'linker = "arm-linux-gnueabihf-gcc"' >> ~/.cargo/config.toml
            echo "CC=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.arch }}" = "mips" ]; then
            echo '[target.mips-unknown-linux-musl]' >> ~/.cargo/config.toml
            echo 'linker = "mips-linux-gnu-gcc"' >> ~/.cargo/config.toml
            echo "CC=mips-linux-gnu-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.arch }}" = "mipsel" ]; then
            echo '[target.mipsel-unknown-linux-musl]' >> ~/.cargo/config.toml
            echo 'linker = "mipsel-linux-gnu-gcc"' >> ~/.cargo/config.toml
            echo "CC=mipsel-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Create ARM64 cargo config
        if: matrix.arch == 'arm64' && matrix.distro != 'freebsd' && matrix.distro != 'openwrt'
        run: |
          mkdir -p ~/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          echo '[target.aarch64-unknown-linux-musl]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml


      - name: Build release binary
        run: |
          if [ "${{ matrix.distro }}" = "openwrt" ] && { [ "${{ matrix.arch }}" = "mips" ] || [ "${{ matrix.arch }}" = "mipsel" ]; }; then
            cargo build --release --target ${{ matrix.target }} -Z build-std
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare binary
        run: |
          cp target/${{ matrix.target }}/release/oil ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Checksum
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.asset_name }} | awk '{print $1}' > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} | awk '{print $1}' > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            asset_name: oil-macos-arm64
          - arch: x64
            target: x86_64-apple-darwin
            asset_name: oil-macos-x64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare binary
        run: |
          cp target/${{ matrix.target }}/release/oil ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}
      - name: Checksum
        run: |
          shasum -a 256 ${{ matrix.asset_name }} | awk '{print $1}' > ${{ matrix.asset_name }}.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  build-openbsd:
    name: Build OpenBSD (x64)
    runs-on: ubuntu-latest
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build on OpenBSD
        uses: cross-platform-actions/action@v0.25.0
        with:
          operating_system: openbsd
          version: '7.5'
          run: |
            sudo pkg_add -I rust gmake
            export PATH="/usr/local/bin:$PATH"
            cargo build --release
      - name: Prepare binary
        run: |
          cp target/release/oil oil-openbsd-x64
          chmod +x oil-openbsd-x64
          shasum -a 256 oil-openbsd-x64 | awk '{print $1}' > oil-openbsd-x64.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oil-openbsd-x64
          path: |
            oil-openbsd-x64
            oil-openbsd-x64.sha256

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [check, generate-notes, build, build-macos, build-openbsd]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: oil-*
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.generate-notes.outputs.version }}
          name: v${{ needs.generate-notes.outputs.version }}
          body: ${{ needs.generate-notes.outputs.release_notes }}
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

